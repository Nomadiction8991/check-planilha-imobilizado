name: Deploy

on:
  push:
    tags:
      - '[0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9][0-9]'
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, checkplanilha]
    steps:
      - name: Atualizar aplicacao
        run: |
          set -euo pipefail

          APP_DIR="/var/www/checkplanilha"
          cd "$APP_DIR"

          git fetch origin --tags --force
          git reset --hard "$GITHUB_SHA"

          # Configurações de ambiente (mantém .env local)
          mkdir -p bootstrap/cache storage/app storage/framework/{cache/data,sessions,views} storage/logs
          
          composer install --no-dev --optimize-autoloader --no-interaction
          npm ci
          npm run build

          php artisan migrate --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          chmod -R u+rwX,go+rX bootstrap/cache storage
